name: Logen Verification & Judge Suite

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  contracts-and-proofs:
    name: Smart Contracts, Interleaving Explorer & Attack Lab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.86.0 & wasm32-unknown-unknown
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.86.0"
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run L0 Unit/Property, LM Receipt-Interleaving (80,620 paths) & Cross-Contract Attack Tests
        run: cargo test --workspace

      - name: Build Release WASM Smart Contracts
        run: cargo build --target wasm32-unknown-unknown --release -p logen-vault -p logen-registry

  web-and-gate:
    name: Web App, NEP-413 Gate & Pair-Check Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Frontend Dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run NEP-413 & Pair-Check Unit Tests
        working-directory: web
        run: pnpm test

      - name: Build Production Next.js Bundle
        working-directory: web
        run: pnpm build
