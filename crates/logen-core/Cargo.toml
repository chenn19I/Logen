[package]
name = "logen-core"
description = "Pure state machines and arithmetic for Logen (no NEAR dependencies)."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Enables borsh derives so the contracts can persist core types directly.
borsh = ["dep:borsh"]

[dependencies]
borsh = { workspace = true, optional = true }
