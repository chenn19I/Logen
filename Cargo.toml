[workspace]
resolver = "2"
members = [
    "crates/logen-core",
    "crates/logen-test-env",
    "contracts/vault",
    "contracts/registry",
]
# Sandbox integration tests live in their own workspace-excluded crate because
# near-workspaces only runs on Linux/macOS (see tests/sandbox/README.md).
exclude = ["tests/sandbox"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/chenn19I/Logen"
authors = ["Logen team"]

[workspace.dependencies]
near-sdk = { version = "=5.9.0", default-features = false, features = ["legacy"] }
borsh = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
logen-core = { path = "crates/logen-core" }
logen-test-env = { path = "crates/logen-test-env" }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = "symbols"
