[package]
name = "pusaka-vault"
description = "Per-seat vault contract for Pusaka: canonical owner, rotation_seq, listing freeze, bounded delegate, and outflows."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
borsh = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
pusaka-core = { workspace = true, features = ["borsh"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pusaka-test-env = { workspace = true }
