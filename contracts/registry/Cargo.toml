[package]
name = "logen-registry"
description = "Logen NEP-171 registry, seat sub-account factory, O(1) revenue accumulator, safe secondary market, and pull ledgers."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
borsh = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
logen-core = { workspace = true, features = ["borsh"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
logen-test-env = { workspace = true }

[dev-dependencies]
logen-vault = { path = "../vault" }
